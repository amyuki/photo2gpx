name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please write in English if you can; Chinese and French are fine too.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drop 20 photos from ...
        2. Add the reference route ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: input
    id: version
    attributes:
      label: Photo2GPX version
      description: Shown in Help → About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Phone / camera
      description: The device that took the photos, if the problem is about positions or times.
      placeholder: "Pixel 7a, Sony A6700, ..."
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic info
      description: |
        In Photo2GPX choose **Help → Copy diagnostic info**, then paste here.
        It contains the app version, your system version and the recent log. It has no GPS coordinates and your home folder is shown as `~`, but please read it before posting.
      placeholder: Paste the diagnostic info here
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images here. Avoid sharing photos or maps that show where you live if you prefer to keep that private.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that could help.
