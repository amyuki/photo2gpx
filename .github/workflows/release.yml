# Builds and publishes a release when a version tag is pushed:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# Release assets (the in-app updater relies on these exact names):
#   Photo2GPX-windows-amd64.exe     Windows 10/11 program
#   Photo2GPX-macos-universal.dmg   macOS installer (Apple Silicon + Intel)
#   Photo2GPX-macos-universal.zip   macOS app bundle, used by the updater
#   checksums.txt                   SHA-256 of all assets, verified by the updater
# GitHub adds the source code (zip / tar.gz) to every release automatically.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for a test run (no release is published), e.g. 0.0.0-test"
        required: false
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install WebKitGTK (needed to compile the desktop package on Linux)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test
        run: go test -tags webkit2_41 ./...

  windows:
    needs: test
    runs-on: ubuntu-24.04 # cross-compiled: the Windows build needs no cgo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Version
        id: v
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "numeric=${V%%[-+]*}" >> "$GITHUB_OUTPUT"
      - name: Windows resources (icon, manifest, version info)
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply \
            --icon build/icon.png --manifest gui \
            --product-name "Photo2GPX" --file-description "Photo2GPX" \
            --copyright "© 2026 Yuki Cheung" \
            --product-version "${{ steps.v.outputs.numeric }}" --file-version "${{ steps.v.outputs.numeric }}" \
            --out rsrc
          rm -f rsrc_windows_386.syso
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -tags desktop,production \
            -ldflags "-H windowsgui -s -w -X main.AppVersion=${{ steps.v.outputs.version }} -X main.GitHubRepo=${{ github.repository }}" \
            -o dist/Photo2GPX-windows-amd64.exe .
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*

  macos:
    needs: test
    # Intel runner: the Apple Silicon (arm64) runners are often unavailable for
    # hours because of capacity limits. Both slices build fine on Intel; the
    # arm64 one is cross-compiled.
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      CGO_ENABLED: "1"
      # Go 1.26 binaries need macOS 12 or later
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      # Wails uses UTType (file dialogs) but does not link its framework itself;
      # the Wails CLI adds this flag, plain "go build" must do it here.
      CGO_LDFLAGS: "-framework UniformTypeIdentifiers"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          clang --version
          go version
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "ldflags=-s -w -X main.AppVersion=$V -X main.GitHubRepo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - name: Build Apple Silicon binary
        env:
          CC: clang -arch arm64
        run: GOARCH=arm64 go build -v -trimpath -tags desktop,production -ldflags "${{ steps.v.outputs.ldflags }}" -o build/bin/Photo2GPX-arm64 .
      - name: Build Intel binary
        run: GOARCH=amd64 go build -v -trimpath -tags desktop,production -ldflags "${{ steps.v.outputs.ldflags }}" -o build/bin/Photo2GPX-amd64 .
      - name: Universal binary
        run: |
          lipo -create -output build/bin/Photo2GPX build/bin/Photo2GPX-arm64 build/bin/Photo2GPX-amd64
          lipo -info build/bin/Photo2GPX
      - name: Assemble Photo2GPX.app
        run: |
          APP=build/bin/Photo2GPX.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/bin/Photo2GPX "$APP/Contents/MacOS/Photo2GPX"
          sed "s/{{VERSION}}/${{ steps.v.outputs.version }}/g" build/darwin/Info.plist > "$APP/Contents/Info.plist"
          ICONSET=build/bin/icon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s build/appicon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) build/appicon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/icon.icns"
          # ad-hoc signature (required on Apple Silicon; the app is not notarized)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
      - name: Package zip and dmg
        run: |
          mkdir -p dist build/bin/dmg
          ditto -c -k --keepParent build/bin/Photo2GPX.app dist/Photo2GPX-macos-universal.zip
          cp -R build/bin/Photo2GPX.app build/bin/dmg/
          ln -s /Applications build/bin/dmg/Applications
          hdiutil create -volname "Photo2GPX" -srcfolder build/bin/dmg -ov -format UDZO dist/Photo2GPX-macos-universal.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/*

  # Publishes what was built. If macOS failed, the Windows release still goes
  # out; "Re-run failed jobs" later adds the macOS files to the same release.
  release:
    needs: [windows, macos]
    if: always() && github.ref_type == 'tag' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum Photo2GPX-* > checksums.txt
          cat checksums.txt
          if [ ! -f Photo2GPX-macos-universal.zip ]; then
            echo "::warning::macOS build missing: this release has the Windows files only. Re-run the failed macos job to add them."
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
